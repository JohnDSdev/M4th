name: Android APK and emulator smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate course and generators
        run: |
          node --check app/src/main/assets/engine.js
          node --check app/src/main/assets/course.js
          node --check app/src/main/assets/app.js
          node scripts/verify.cjs
      - name: Bundle offline KaTeX
        run: |
          npm install --prefix /tmp/m4th-vendor --no-audit --no-fund katex@0.16.21
          mkdir -p app/src/main/assets/vendor
          cp /tmp/m4th-vendor/node_modules/katex/dist/katex.min.js app/src/main/assets/vendor/
          cp /tmp/m4th-vendor/node_modules/katex/dist/katex.min.css app/src/main/assets/vendor/
          cp /tmp/m4th-vendor/node_modules/katex/dist/contrib/auto-render.min.js app/src/main/assets/vendor/
          cp -r /tmp/m4th-vendor/node_modules/katex/dist/fonts app/src/main/assets/vendor/
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: M4th-Unit2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
